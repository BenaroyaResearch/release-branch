name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      # The tests commit to throwaway repos, which needs an identity.
      - run: |
          git config --global user.email ci@example.test
          git config --global user.name ci
      - run: npm test
