name: publish

# Publishing a GitHub release publishes the package at the version in
# package.json. The tag must match it, so a release can never publish a
# version other than the one it names.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@benaroyaresearch'
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$version" ] || { echo "::error::Release tag $TAG does not match package.json ($version)."; exit 1; }
      - run: |
          git config --global user.email ci@example.test
          git config --global user.name ci
      - run: npm test
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
